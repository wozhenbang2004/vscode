          PATCH
          echo '7ec24cb10c804fcd91767dfc5c7db5edc556280a0ef8831a9cf1d50edb61deed  '"$RUNNER_TEMP/auth-provider-lifecycle.patch" | sha256sum -c -
          git apply --check "$RUNNER_TEMP/auth-provider-lifecycle.patch"
          git apply "$RUNNER_TEMP/auth-provider-lifecycle.patch"
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 2
