      - name: Use the repository's exact Node version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, same as upstream
        with:
          node-version-file: .nvmrc
          check-latest: false
          package-manager-cache: false

      - name: Install Linux build and Electron runtime dependencies
        run: |
          ./build/azure-pipelines/linux/apt-retry.sh sudo apt-get update
          ./build/azure-pipelines/linux/apt-retry.sh sudo apt-get install -y \
            build-essential pkg-config libx11-dev libx11-xcb-dev libxkbfile-dev \
            libnotify-bin libkrb5-dev xvfb xauth libgtk-3-0 libgbm1 libasound2t64
          node --version | tee validation-logs/node-version.log
          npm --version | tee validation-logs/npm-version.log

      - name: Install lockfile dependencies with the official Linux native toolchain
        timeout-minutes: 45
        run: |
          npm ci --prefix build 2>&1 | tee validation-logs/install-build.log
          # Match upstream Linux CI's Electron-native-module compiler setup.
          source ./build/azure-pipelines/linux/setup-env.sh
          node build/npm/preinstall.ts 2>&1 | tee validation-logs/prepare-headers.log
          npm ci 2>&1 | tee validation-logs/install.log
          node build/npm/electronTypes.ts 2>&1 | tee validation-logs/electron-types.log

      - name: Run official changed-file hygiene and ESLint
        run: |
          npm run hygiene -- --changed-since "$BASE_SHA" 2>&1 | tee validation-logs/hygiene.log
          npm run eslint -- --changed-since "$BASE_SHA" 2>&1 | tee validation-logs/eslint.log

      - name: Run official client typecheck
        run: npm run typecheck-client 2>&1 | tee validation-logs/typecheck-client.log

      - name: Transpile the client with the official Linux CI task
        run: npm run gulp transpile-client-esbuild 2>&1 | tee validation-logs/transpile-client.log

      - name: Download and verify the repository-pinned Electron
        run: npm run electron -- x64 2>&1 | tee validation-logs/electron-setup.log

      # No DOM stubs or custom harness. These are the repository's Electron/Mocha runners.
      # --no-sandbox applies only to these isolated CI test processes; no host sysctl changes.
      - name: Run MainThreadAuthentication through the official Electron runner
        timeout-minutes: 10
        env:
          VSCODE_SKIP_PRELAUNCH: '1'
        run: |
          xvfb-run -a ./scripts/test.sh --no-sandbox --disable-gpu \
            --tfs 'Auth main thread' \
            --run src/vs/workbench/api/test/browser/mainThreadAuthentication.test.ts \
            2>&1 | tee validation-logs/main-thread-authentication.log

      - name: Run AuthenticationService through the official Electron runner
        timeout-minutes: 10
        env:
          VSCODE_SKIP_PRELAUNCH: '1'
        run: |
          xvfb-run -a ./scripts/test.sh --no-sandbox --disable-gpu \
            --tfs 'Auth service' \
            --run src/vs/workbench/services/authentication/test/browser/authenticationService.test.ts \
            2>&1 | tee validation-logs/authentication-service.log

      - name: Assert both suites actually executed and passed
        run: |
          python3 - <<'PYTEST'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          expected = {
              'linux-x64-auth-main-thread-results.xml': [
                  'does not remove another host provider with a pending registration RPC (first registration)',
                  'does not remove another host provider with a pending registration RPC (previous registration)',
                  'external unregister notifies the owning host but not other hosts',
                  'revives session URIs and preserves optional session fields',
                  'removes host-owned dynamic providers without changing persisted registration',
                  'rediscovers the provider on a replacement host instead of reusing the stopped RPC',
                  'keeps another host provider when one host is disposed',
                  'old-host disposal preserves a replacement with the same id',
                  'old-host late unregister preserves a replacement with the same id',
                  'explicit unregister and re-register produce exactly one removal each',
                  'same-host replacement continues forwarding session events',
              ],
              'linux-x64-auth-service-results.xml': [
                  'registerDeclaredAuthenticationProvider',
                  'unregisterDeclaredAuthenticationProvider',
                  'isAuthenticationProviderRegistered',
                  'unregisterAuthenticationProvider',
                  'getProviderIds',
                  'getProvider',
                  'getOrActivateProviderIdForServer - should return undefined when no provider matches the authorization server',
                  'getOrActivateProviderIdForServer - should return provider id if authorizationServerGlobs matches and authorizationServers match',
                  'getOrActivateProviderIdForServer - should return undefined if authorizationServerGlobs match but authorizationServers do not match',
                  'getOrActivateProviderIdForAuthorizationServer - should check multiple providers and return the first match',
                  'getOrActivateProviderIdForServer - should match when resourceServer matches provider resourceServer',
                  'getOrActivateProviderIdForServer - should not match when resourceServer does not match provider resourceServer',
                  'getOrActivateProviderIdForServer - should match when provider has no resourceServer and resourceServer is provided',
                  'getOrActivateProviderIdForServer - should match when provider has resourceServer but no resourceServer is provided',
                  'getOrActivateProviderIdForServer - should distinguish between providers with same authorization server but different resource servers',
                  'getSessions - base case',
                  'getSessions - authorization server is not registered',
                  'createSession',
                  'getSessions - forwards resource option to provider',
                  'createSession - forwards resource option to provider',
                  'removeSession',
                  'onDidChangeSessions',
                  'should resolve when provider registers even if activateByEvent never resolves (#315841)',
                  'should resolve when activateByEvent completes and provider is already registered',
              ],
          }
          for pattern, names in expected.items():
              path = Path('test-results') / pattern
              root = ET.parse(path).getroot()
              cases = root.findall('.//testcase')
              assert len(cases) >= len(names), (path, len(cases), len(names))
              actual = [case.get('name', '') for case in cases]
              for name in names:
                  assert any(value == name or value.endswith(' ' + name) for value in actual), (path, 'missing test', name)
              assert not root.findall('.//failure'), path
              assert not root.findall('.//error'), path
              assert not root.findall('.//skipped'), path
              print(f'{path}: {len(cases)} tests, no failures/errors/skips')
          PYTEST

      - name: Preserve actual logs and JUnit results even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, same as upstream
        with:
          name: vscode-343316-official-validation-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            validation-logs/
            test-results/
